<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ecliptica Platformer</title>
    <link rel="stylesheet" href="./src/styles.css">
  </head>
  <body>
    <main class="shell" aria-label="Ecliptica Platformer">
      <section class="hud" aria-label="Game status">
        <div class="brand">Ecliptica</div>
        <div class="meter" aria-label="Blood sigils">
          <span class="acorn-mark" aria-hidden="true"></span>
          <span data-acorns>0/6</span>
        </div>
        <div class="gate" data-state>LOCKED</div>
        <div class="actions">
          <button type="button" class="icon-button" data-pause aria-label="Pause" aria-pressed="false">II</button>
          <button type="button" class="icon-button" data-restart aria-label="Restart">↻</button>
        </div>
      </section>

      <canvas id="game" width="960" height="540"></canvas>

      <nav class="touch-controls" aria-label="Touch controls">
        <button type="button" data-touch="left" aria-label="Left">←</button>
        <button type="button" data-touch="jump" aria-label="Jump">↑</button>
        <button type="button" data-touch="right" aria-label="Right">→</button>
      </nav>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
